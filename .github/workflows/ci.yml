name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Run evaluation quality gates
        run: python -m src.models.evaluate --train-if-missing --fail-on-gates

      - name: Check import sanity
        run: python -c "from src.serving.api import app; print('API import OK')"

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: |
            reports/metrics/latest_metrics.json
            reports/figures/confusion_matrix.png
            reports/figures/calibration_curve.png
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t medrisk-api .

      - name: Build UI image
        run: docker build -t medrisk-ui -f Dockerfile.ui .
