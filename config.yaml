data:
  raw_path: data/raw/diabetic_data.csv

features:
  numeric:
    - age_ordinal
    - time_in_hospital
    - num_lab_procedures
    - num_procedures
    - num_medications
    - number_diagnoses
    - num_med_changes
    - num_meds_active
    - total_prior_visits
    - insulin_changed
    - high_utilizer
    - medical_specialty_missing
  categorical:
    - race
    - gender
    - diag1_category
    - diag2_category
    - diag3_category
    - admission_type_id
  high_utilizer_threshold: 5

training:
  test_size: 0.15
  val_size: 0.15
  random_state: 42
  n_optuna_trials: 50
  optimization_metric: pr_auc
  threshold_min_recall: 0.70
  cv_folds: 5
  models:
    - logistic_regression
    - random_forest
    - xgboost
    - lightgbm

mlflow:
  experiment_name: medrisk-readmission

serving:
  host: 0.0.0.0
  port: 8000
  model_path: models/best_model.joblib
  preprocessor_path: models/preprocessor.joblib
  threshold_path: models/threshold.json
  model_version: xgboost-v1.0-optuna

paths:
  models_dir: models
  reports_dir: reports/figures
  metrics_path: reports/metrics/latest_metrics.json

quality_gates:
  min_pr_auc: 0.10
  min_recall: 0.70
  max_brier_score: 0.30
  subgroup_max_recall_gap: 0.20
